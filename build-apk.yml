name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q ./*.zip -d proj
          P=$(dirname "$(find proj -name pubspec.yaml | head -1)")
          echo "PROJ=$P" >> "$GITHUB_ENV"
          echo "Project folder: $P"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp "$PROJ/debug.keystore" ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1|SHA256"

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tallykhata-apk
          path: ${{ env.PROJ }}/build/app/outputs/flutter-apk/app-release.apk
